<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export QR Code Pemain — Futsal ITDA</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- Pustaka JSZip untuk Unduh Massal -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <!-- Stylesheet Terpisah -->
  <link rel="stylesheet" href="qr-exporter.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <div class="header-kicker">Generator Kartu</div>
        <h1>Export QR Code Pemain</h1>
        <p>Tarik data dari spreadsheet atau tempel daftar pemain untuk mengunduh kartu QR.</p>
      </div>
      <a href="index.html" class="back-link">
        <span>←</span>
        <span>Kembali ke Presensi</span>
      </a>
    </header>

    <div class="card">
      <div class="toolbar">
        <button id="btnFetchDb" type="button" class="btn btn-primary">Ambil dari Database</button>
        <button id="btnGenerate" type="button" class="btn btn-ghost">Tampilkan Preview</button>
        <button id="btnClearInput" type="button" class="btn btn-ghost">Bersihkan</button>
        <label class="check-label">
          <input id="onlyActiveCheck" type="checkbox" checked />
          <span>Hanya status <code>active</code></span>
        </label>
        <span id="infoCount" class="meta">Siap memuat data pemain.</span>
      </div>

      <textarea id="rawInput" placeholder="Format per baris: token_qr | nama | posisi&#10;Contoh: PLY-ITDA-001 | Rizky Pratama | Coach"></textarea>
    </div>

    <div class="preview-header">
      <div class="preview-left">
        <h2 class="preview-title">Preview Kartu QR</h2>
        <span id="cardCounterBadge" class="count-badge">0 Kartu</span>
      </div>
      <div class="preview-actions">
        <input id="searchCardInput" class="search-card-input" type="search" placeholder="Cari kartu pemain..." />
        <button id="btnDownloadZip" type="button" class="btn btn-primary" disabled>Unduh Semua (.ZIP)</button>
      </div>
    </div>

    <div id="qrGrid" class="grid">
      <div class="empty-grid-state">Belum ada preview kartu. Klik <strong>Ambil dari Database</strong> lalu <strong>Tampilkan Preview</strong>.</div>
    </div>
  </div>

  <!-- Script Logika Export QR -->
  <script src="qr-exporter.js"></script>
</body>
</html>
