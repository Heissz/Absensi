<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export QR Code Pemain — Futsal ITDA</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg-page: #fcfcfd;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-hairline: #e2e8f0;
      --accent: #0f766e;
      --accent-soft: #f0fdfa;
      --accent-border: #99f6e4;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-main);
      padding: 28px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.86rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .back-link:hover {
      background: var(--bg-subtle);
      border-color: #cbd5e1;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      margin-top: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-hairline);
      font-size: 0.84rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text-main);
      background: var(--bg-subtle);
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #115e59;
    }

    .btn-ghost {
      background: var(--bg-surface);
      color: var(--text-main);
      border-color: var(--border-hairline);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-subtle);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .meta {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .qr-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .qr-card canvas {
      width: 160px;
      height: 160px;
      border-radius: 8px;
    }

    .player-name {
      margin-top: 10px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .player-pos {
      margin-top: 3px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .player-token {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .qr-card .btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Export QR Code Pemain</h1>
        <p>Mengambil data dari tab <code>Players</code> di Google Sheets lalu export PNG atau ZIP.</p>
      </div>
      <a href="index.html" class="back-link">← Kembali ke Presensi</a>
    </div>

    <div class="card">
      <div class="toolbar">
        <button id="btnFetchDb" class="btn btn-primary">Ambil dari Database</button>
        <button id="btnGenerate" class="btn btn-ghost">Buat Pratinjau dari Teks</button>
        <button id="btnDownloadZip" class="btn btn-ghost">Export Semua (.ZIP)</button>
        <label class="check-label">
          <input id="onlyActiveCheck" type="checkbox" checked />
          Hanya status <code>active</code>
        </label>
        <span id="infoCount" class="meta">Memuat data...</span>
      </div>

      <textarea id="rawInput" placeholder="Data dari database akan tampil di sini, atau Anda bisa mengetik manual: qr_token | nama | posisi"></textarea>
    </div>

    <div id="qrGrid" class="grid"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjKKp4maxqy3T4unEJ7plI4vvW09h_z0sqRSy6iIbCbVTJgDZkiX8Zy42Ry1M7g3-L/exec";

    const rawInput = document.getElementById("rawInput");
    const qrGrid = document.getElementById("qrGrid");
    const infoCount = document.getElementById("infoCount");
    const btnFetchDb = document.getElementById("btnFetchDb");
    const btnGenerate = document.getElementById("btnGenerate");
    const btnDownloadZip = document.getElementById("btnDownloadZip");
    const onlyActiveCheck = document.getElementById("onlyActiveCheck");

    let dbPlayers = [];
    let generatedItems = [];

    function parseLines(text) {
      return text
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => {
          const parts = line.split(/\t|\||,/).map((p) => p.trim());
          return {
            token: parts[0] || "",
            name: parts[1] || parts[0] || "",
            position: parts[2] || ""
          };
        })
        .filter((item) => item.token);
    }

    function sanitizeFilename(str) {
      return String(str || "qr")
        .trim()
        .replace(/[^a-zA-Z0-9_-]+/g, "_")
        .replace(/^_+|_+$/g, "") || "qr";
    }

    async function renderExportCanvas(item) {
      const canvas = document.createElement("canvas");
      canvas.width = 420;
      canvas.height = 500;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 4;
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

      const qrTempCanvas = document.createElement("canvas");
      await QRCode.toCanvas(qrTempCanvas, item.token, {
        width: 280,
        margin: 2,
        color: { dark: "#0f172a", light: "#ffffff" }
      });

      const qrX = Math.floor((canvas.width - qrTempCanvas.width) / 2);
      ctx.drawImage(qrTempCanvas, qrX, 42);

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold 24px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(item.name, canvas.width / 2, 365);

      if (item.position) {
        ctx.fillStyle = "#0f766e";
        ctx.font = "600 17px system-ui, sans-serif";
        ctx.fillText(item.position, canvas.width / 2, 396);
      }

      ctx.fillStyle = "#64748b";
      ctx.font = "15px ui-monospace, monospace";
      ctx.fillText(item.token, canvas.width / 2, 434);

      return canvas;
    }

    function downloadDataUrl(dataUrl, filename) {
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function buildCardsFromItems(items) {
      qrGrid.innerHTML = "";
      generatedItems = [];

      for (const item of items) {
        const card = document.createElement("div");
        card.className = "qr-card";

        const canvas = await renderExportCanvas(item);
        const filename = `${sanitizeFilename(item.token)}_${sanitizeFilename(item.name)}.png`;
        generatedItems.push({ ...item, canvas, filename });

        const btnSingle = document.createElement("button");
        btnSingle.className = "btn btn-ghost";
        btnSingle.textContent = "Unduh PNG";
        btnSingle.addEventListener("click", () => {
          downloadDataUrl(canvas.toDataURL("image/png"), filename);
        });

        card.appendChild(canvas);

        const nameEl = document.createElement("div");
        nameEl.className = "player-name";
        nameEl.textContent = item.name;
        card.appendChild(nameEl);

        if (item.position) {
          const posEl = document.createElement("div");
          posEl.className = "player-pos";
          posEl.textContent = item.position;
          card.appendChild(posEl);
        }

        const tokEl = document.createElement("div");
        tokEl.className = "player-token";
        tokEl.textContent = item.token;
        card.appendChild(tokEl);

        card.appendChild(btnSingle);
        qrGrid.appendChild(card);
      }

      infoCount.textContent = `${generatedItems.length} kartu siap`;
    }

    function applyDbFilterAndRender() {
      const filterActive = onlyActiveCheck.checked;
      const filtered = dbPlayers
        .filter((p) => p.qr_token)
        .filter((p) => !filterActive || String(p.status || "").trim().toLowerCase() === "active")
        .map((p) => ({
          token: String(p.qr_token || "").trim(),
          name: String(p.player_name || p.qr_token || "").trim(),
          position: String(p.position || "").trim()
        }));

      rawInput.value = filtered
        .map((x) => `${x.token} | ${x.name} | ${x.position}`)
        .join("\n");

      buildCardsFromItems(filtered);
    }

    async function fetchPlayersFromDb() {
      btnFetchDb.disabled = true;
      infoCount.textContent = "Mengambil data dari database...";
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=players`);
        const result = await res.json();
        if (!result.ok) throw new Error(result.message || "Gagal mengambil data pemain");

        dbPlayers = Array.isArray(result.data) ? result.data : [];
        applyDbFilterAndRender();
      } catch (err) {
        infoCount.textContent = "Error: " + err.message;
      } finally {
        btnFetchDb.disabled = false;
      }
    }

    async function exportAllAsZip() {
      if (generatedItems.length === 0) {
        await buildCardsFromItems(parseLines(rawInput.value));
      }
      if (generatedItems.length === 0) return;

      const zip = new JSZip();
      for (const entry of generatedItems) {
        const base64 = entry.canvas.toDataURL("image/png").split(",")[1];
        zip.file(entry.filename, base64, { base64: true });
      }

      const blob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(blob);
      downloadDataUrl(url, "qr_pemain_futsal_itda.zip");
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    btnFetchDb.addEventListener("click", fetchPlayersFromDb);
    onlyActiveCheck.addEventListener("change", applyDbFilterAndRender);
    btnGenerate.addEventListener("click", () => buildCardsFromItems(parseLines(rawInput.value)));
    btnDownloadZip.addEventListener("click", exportAllAsZip);

    fetchPlayersFromDb();
  </script>
</body>
</html>
